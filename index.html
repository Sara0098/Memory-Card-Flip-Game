
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Memory Card Game</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="game-container">

        <h1>🧠 Memory Card Flip Game</h1>

        <p class="subtitle">Find all matching pairs!</p>

        <div class="game-board">

            <div class="card" data-value="🍎">
                <div class="front">?</div>
                <div class="back">🍎</div>
            </div>

            <div class="card" data-value="🍎">
                <div class="front">?</div>
                <div class="back">🍎</div>
            </div>

            <div class="card" data-value="🍌">
                <div class="front">?</div>
                <div class="back">🍌</div>
            </div>

            <div class="card" data-value="🍌">
                <div class="front">?</div>
                <div class="back">🍌</div>
            </div>

            <div class="card" data-value="🍕">
                <div class="front">?</div>
                <div class="back">🍕</div>
            </div>

            <div class="card" data-value="🍕">
                <div class="front">?</div>
                <div class="back">🍕</div>
            </div>

            <div class="card" data-value="⚽">
                <div class="front">?</div>
                <div class="back">⚽</div>
            </div>

            <div class="card" data-value="⚽">
                <div class="front">?</div>
                <div class="back">⚽</div>
            </div>

        </div>

        <p id="message"></p>

        <button onclick="restartGame()">🔄 Restart Game</button>

    </div>

    <script src="script.js"></script>

</body>
</html>
